<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar • Roselium Games</title>
    <meta name="theme-color" content="#1a0f0f" />
    <link rel="stylesheet" href="style.css" />
    <script src="config.js"></script>
    <script src="calendar.js" defer></script>
  </head>
  <body data-page="calendar">
    <div class="sticky-top">
      <div class="season-banner">
        Season one week one, Sunday October 4th 2pm to 6:30pm @ The Battle
        Standard East Windsor
      </div>
      <header class="site-header">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="brand" href="index.html">Roselium Games</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="unmatched.html">Unmatched</a>
          <a href="dice-throne.html">Dice Throne</a>
          <a href="players.html">Leaderboards</a>
          <a href="characters.html">Champion Records</a>
          <a href="calendar.html" class="active">Calendar</a>
        </div>
      </nav>
      </header>
    </div>

    <main class="page page-stack">
      <section class="page-intro">
        <h1>Event calendar</h1>
      </section>

      <section class="card next-event-card" id="next-event-card">
        <span class="eyebrow">Next Up</span>
        <h2 id="next-event-name">Loading…</h2>
        <p id="next-event-date"></p>
      </section>

      <div class="calendar-frame" id="agenda-list">
        <p class="status">Loading events…</p>
      </div>
    </main>

    <footer class="site-footer">
      <p>Roselium Games • community-managed records for tactical play nights</p>
    </footer>
  </body>
